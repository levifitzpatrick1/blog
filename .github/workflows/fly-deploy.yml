name: Fly Deploy

on:
  push:
    branches:
      - trunk

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/fly-pr-review-apps/setup-flyctl@main
      - run: |
          flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
