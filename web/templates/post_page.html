<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ .Title }}</title>
        <link rel="stylesheet" href="/static/css/style.css" />
    </head>
    <body class="bg-background p-4 sm:p-6 md:p-8">
        <div
            class="max-w-4xl mx-auto bg-card-background p-6 sm:p-8 rounded-lg shadow"
        >
            <div class="mb-4">
                <a
                    href="/"
                    class="back-button text-2xl text-background bg-accent w-auto px-2 py-0.5 rounded-2xl hover:bg-accent-hover inline-block overflow-hidden"
                >
                    <span class="arrow-span">&larr;</span>
                </a>
            </div>

            <div class="mb-8">
                <h1 class="text-4xl font-bold text-primary mb-2">
                    {{ .Title }}
                </h1>

                <p class="text-sm text-secondary">
                    Levi Fitzpatrick | Published: {{ .PublishDate }} {{- if
                    .ShowUpdateDate }}
                    <span class="italic text-secondary">
                        * Updated: {{ .UpdateDate }}
                    </span>
                    {{- end }}
                </p>
            </div>

            <article class="text-primary prose lg:prose-xl max-w-none">
                {{ .HTMLContent }}
            </article>
        </div>
    </body>
</html>
