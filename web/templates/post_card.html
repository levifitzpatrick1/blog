<div
    class="group border-border border- max-w-sm rounded-xl overflow-hidden shadow-xs shadow-black bg-card-background hover:shadow-md hover:shadow-accent-hover transition-shadow duration-300 ease-in-out"
>
    <div class="px-6 py-4">
        <div class="flex justify-between items-start mb-2">
            <div class="font-bold text-primary text-xl">{{ .Title }}</div>
            <div class="text-secondary text-sm">
                {{ if .Published.Valid }}
                    {{ .Published.Time.Format "January 2, 2006" }}
                {{ end }}
            </div>
        </div>
        <div class="px-2">
            <hr class="text-secondary" />
        </div>
        <div class="relative h-24 overflow-hidden">
            <p class="text-secondary text-base">{{ .Excerpt }} ...</p>
            <div
                class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-card-background to-transparent"
            ></div>
        </div>
    </div>
    <div class="px-6 pt-2 pb-4"></div>
</div>
